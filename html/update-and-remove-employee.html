<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعديل / حذف موظف - نظام متابعة المشروعات</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/settings.css" />
  </head>

  <body class="no-sidebar">
    <!-- ================= MAIN الأول: تعديل بيانات موظف ================= -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold">الأعدادات</h2>
        <a href="../html/dashboard.html" class="btn btn-outline-primary">
          <i class="fas fa-arrow-right ms-0"></i> العودة للوحة التحكم
        </a>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <div class="input-group">
            <input
              type="text"
              id="searchname"
              class="form-control"
              placeholder="أدخل اسم الموظف"
            />
            <button class="btn btn-primary" id="searchEmployeeBtn">بحث</button>
          </div>
        </div>
      </div>

      <div class="card d-none" id="editEmployeeCard">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fas fa-user-edit me-2"></i> تعديل بيانات الموظف
          </h5>
        </div>

        <div class="card-body p-4">
          <form id="editEmployeeForm" class="d-none">
            <div class="row g-3">
              <h5 class="form-section-title">البيانات الأساسية</h5>

              <div class="col-md-6">
                <label for="name" class="form-label">اسم الموظف</label>
                <input type="text" id="name" class="form-control" required />
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" required />
              </div>

              <div class="col-md-6">
                <label for="role" class="form-label">الدور الوظيفي</label>
                <select id="role" class="form-select" required>
                  <option disabled selected value="">اختر الدور</option>
                  <option value="admin">أدمن</option>
                  <option value="manager">تخطيط ومتابعه</option>
                  <option value="financial">مالي</option>
                  <option value="executive">تنفيذي</option>
                  <option value="contractual">تعاقدية</option>
                  <option value="projectManager">مشروعات</option>
                  <option value="employee">موظف</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="region" class="form-label">المحافظة</label>
                <select id="region" class="form-select">
                  <option disabled selected value="">اختر المحافظة</option>
                  <option value="شمال سيناء">شمال سيناء</option>
                  <option value="جنوب سيناء">جنوب سيناء</option>
                  <option value="بورسعيد">بورسعيد</option>
                  <option value="الإسماعيلية">الإسماعيلية</option>
                  <option value="السويس">السويس</option>
                  <option value="الشرقية">الشرقية</option>
                  <option value="دمياط">دمياط</option>
                </select>
              </div>

              <div class="col-12 mt-4 text-center">
                <a href="../html/dashboard.html" class="btn btn-secondary px-4"
                  >إلغاء</a
                >
                <button
                  type="submit"
                  class="btn btn-primary px-4"
                  id="updateEmployeeBtn"
                >
                  تحديث البيانات
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- ================= MAIN الثاني: حذف موظف + المحافظات + الاستشاريين ================= -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold">حذف موظف</h2>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <div class="input-group">
            <input
              type="text"
              id="searchnameDelete"
              class="form-control"
              placeholder="أدخل اسم الموظف"
            />
            <button class="btn btn-primary" id="searchnameDelete">بحث</button>
          </div>
        </div>
      </div>

      <div class="card d-none" id="deleteEmployeeCard">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fas fa-user-edit me-2"></i> بيانات الموظف
          </h5>
        </div>

        <div class="card-body p-4">
          <form id="deleteEmployeeForm" class="d-none">
            <div class="row g-3">
              <h5 class="form-section-title">البيانات الأساسية</h5>

              <div class="col-md-6">
                <label for="name" class="form-label">اسم الموظف</label>
                <input type="text" id="name" class="form-control" disabled />
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" disabled />
              </div>

              <div class="col-md-6">
                <label for="role" class="form-label">الدور الوظيفي</label>
                <select id="role" class="form-select" disabled>
                  <option selected disabled value="">اختر الدور</option>
                  <option value="admin">أدمن</option>
                  <option value="manager">تخطيط ومتابعه</option>
                  <option value="financial">مالي</option>
                  <option value="executive">تنفيذي</option>
                  <option value="contractual">تعاقدية</option>
                  <option value="projectManager">مشروعات</option>
                  <option value="employee">موظف</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="region" class="form-label">المحافظة</label>
                <select id="region" class="form-select" required>
                  <option selected disabled value="">اختر المحافظة</option>
                  <option value="شمال سيناء">شمال سيناء</option>
                  <option value="جنوب سيناء">جنوب سيناء</option>
                  <option value="بورسعيد">بورسعيد</option>
                  <option value="الإسماعيلية">الإسماعيلية</option>
                  <option value="السويس">السويس</option>
                  <option value="الشرقية">الشرقية</option>
                  <option value="دمياط">دمياط</option>
                </select>
              </div>

              <div class="col-12 mt-4 text-center">
                <a href="../html/dashboard.html" class="btn btn-secondary px-4"
                  >إلغاء</a
                >

                <button
                  type="submit"
                  class="btn btn-danger px-4"
                  id="confirmDeleteBtn"
                >
                  تأكيد الحذف
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </main>

    <div class="toast-container position-fixed top-0 start-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/employees/update-and-remove-employee.js"></script>
    <script src="../JS/employees/governorates-and-consultant.js"></script>
  </body>
</html>
