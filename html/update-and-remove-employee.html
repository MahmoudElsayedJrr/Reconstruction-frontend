<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعدادات إدارة الموظفين</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/settings.css" />
  </head>

  <body class="no-sidebar">
    <!-- Page Header -->
    <div class="page-header">
      <div class="header-content">
        <div class="header-title">
          <div class="icon-wrapper">
            <i class="fas fa-sliders"></i>
          </div>
          <div class="title-text">
            <h1>إعدادات إدارة الموظفين</h1>
            <p class="header-subtitle">
              البحث عن الموظفين وتعديل بياناتهم، حذف الحسابات، وإلغاء القفل
            </p>
          </div>
        </div>
        <a href="../html/dashboard.html" class="btn-back">
          <i class="fas fa-arrow-right"></i>
          <span>العودة للوحة التحكم</span>
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="row">
        <!-- Edit Employee Column -->
        <div class="col-lg-6 mb-4">
          <h2 class="section-heading">
            <i class="fas fa-user-pen"></i>
            تعديل موظف
          </h2>
          <div class="card mb-4">
            <div class="card-body">
              <div class="input-group">
                <input
                  type="text"
                  id="searchname"
                  class="form-control"
                  placeholder="أدخل اسم الموظف لتعديله..."
                />
                <button class="btn btn-primary" id="searchEmployeeBtn">
                  <i class="fas fa-search me-1"></i> بحث
                </button>
              </div>
            </div>
          </div>

          <div class="card d-none" id="editEmployeeCard">
            <div class="card-header">
              <h5 class="mb-0">
                <i class="fas fa-user-edit me-2"></i> تعديل بيانات الموظف
              </h5>
            </div>
            <div class="card-body p-4">
              <form id="editEmployeeForm" class="d-none">
                <div class="row g-3">
                  <h5 class="form-section-title">البيانات الأساسية</h5>
                  <div class="col-md-6">
                    <label for="editName" class="form-label">الاسم</label>
                    <input
                      type="text"
                      class="form-control"
                      id="editName"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="editEmail" class="form-label">البريد الإلكتروني</label>
                    <input
                      type="email"
                      class="form-control"
                      id="editEmail"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="editRole" class="form-label">الدور الوظيفي</label>
                    <select class="form-select" id="editRole" required>
                      <option value="employee">موظف عادي</option>
                      <option value="admin">مسؤول (Admin)</option>
                      <option value="super_admin">مدير عام (Super Admin)</option>
                      <option value="manager">مدير</option>
                      <option value="executive">منفذ</option>
                      <option value="financial">مالي</option>
                      <option value="contractual">تعاقدات</option>
                      <option value="projectManager">مدير مشروع</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="editRegion" class="form-label">المحافظة / التغطية</label>
                    <select class="form-select" id="editRegion">
                      <option value="الكل">الكل</option>
                      <option value="شمال سيناء">شمال سيناء</option>
                      <option value="جنوب سيناء">جنوب سيناء</option>
                      <option value="بورسعيد">بورسعيد</option>
                      <option value="الإسماعيلية">الإسماعيلية</option>
                      <option value="السويس">السويس</option>
                      <option value="الشرقية">الشرقية</option>
                      <option value="دمياط">دمياط</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 mt-4 text-center">
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-1"></i> حفظ التعديلات
                  </button>
                  <button
                    type="button"
                    class="btn btn-secondary px-4 me-2"
                    id="cancelEditBtn"
                  >
                    إلغاء
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Delete Employee Column -->
        <div class="col-lg-6 mb-4">
          <h2 class="section-heading text-danger">
            <i class="fas fa-user-minus"></i>
            حذف موظف
          </h2>
          <div class="card mb-4">
            <div class="card-body">
              <div class="input-group">
                <input
                  type="text"
                  id="searchDeleteName"
                  class="form-control"
                  placeholder="أدخل اسم الموظف لحذفه..."
                />
                <button class="btn btn-danger" id="searchDeleteEmployeeBtn">
                  <i class="fas fa-search me-1"></i> بحث
                </button>
              </div>
            </div>
          </div>

          <div class="card d-none" id="deleteEmployeeCard">
            <div class="card-header bg-danger text-white">
              <h5 class="mb-0 text-danger">
                <i class="fas fa-exclamation-triangle me-2"></i> تأكيد حذف الموظف
              </h5>
            </div>
            <div class="card-body p-4 text-center">
              <div class="delete-icon mb-3">
                <i class="fas fa-user-slash text-danger fs-1"></i>
              </div>
              <p class="fs-5 fw-bold" id="deleteEmployeeNameDisplay"></p>
              <p class="text-muted">هل أنت متأكد من حذف هذا الموظف نهائياً؟ لا يمكن التراجع عن هذا الإجراء.</p>
              <div class="mt-4">
                <button class="btn btn-danger px-4" id="confirmDeleteEmployeeBtn">
                  <i class="fas fa-trash-alt me-1"></i> تأكيد الحذف
                </button>
                <button class="btn btn-secondary px-4 me-2" id="cancelDeleteBtn">
                  إلغاء
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Unlock Section -->
      <div class="mt-5">
        <h2 class="section-heading">
          <i class="fas fa-lock-open"></i>
          فك قفل حساب الموظف
        </h2>
        <div class="card">
          <div class="card-body">
            <div class="input-group">
              <input
                type="text"
                id="unlockName"
                class="form-control"
                placeholder="أدخل اسم الموظف لفك قفل الحساب..."
              />
              <button class="btn btn-success" id="unlockAccountBtn">
                <i class="fas fa-key me-1"></i> فك قفل الحساب
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container position-fixed top-0 start-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/employees/update-and-remove-employee.js"></script>
  </body>
</html>
