<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المخصص المالي</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/budget.css" />
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              />
            </svg>
          </div>
          <h1>المخصص المالي</h1>
          <p>تحديد المخصص المالي للسنة المالية</p>
        </div>

        <div class="card-body">
          <form id="budgetForm">
            <div class="form-group">
              <label class="form-label">
                <svg class="label-icon" viewBox="0 0 24 24">
                  <rect x="2" y="5" width="20" height="14" rx="2" />
                  <path d="M2 10h20" />
                </svg>
                القيمة المالية
              </label>
              <div class="input-wrapper">
                <input
                  type="number"
                  class="form-input"
                  id="amountInput"
                  placeholder="أدخل قيمة المخصص المالي"
                  min="0"
                  step="any"
                  required
                />
                <span class="currency-badge">ج.م</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">
                <svg class="label-icon" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                السنة المالية
              </label>
              <div class="select-wrapper">
                <select class="form-select" id="yearSelect" required>
                  <option value="" disabled selected>اختر السنة المالية</option>
                  <option value="2024/2025">2024/2025</option>
                  <option value="2025/2026">2025/2026</option>
                  <option value="2026/2027">2026/2027</option>
                  <option value="2027/2028">2027/2028</option>
                  <option value="2028/2029">2028/2029</option>
                  <option value="2029/2030">2029/2030</option>
                  <option value="2030/2031">2030/2031</option>
                  <option value="2031/2032">2031/2032</option>
                  <option value="2032/2033">2032/2033</option>
                  <option value="2033/2034">2033/2034</option>
                  <option value="2034/2035">2034/2035</option>
                  <option value="2035/2036">2035/2036</option>
                  <option value="2036/2037">2036/2037</option>
                  <option value="2037/2038">2037/2038</option>
                  <option value="2038/2039">2038/2039</option>
                  <option value="2039/2040">2039/2040</option>
                  <option value="2040/2041">2040/2041</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
              <svg class="btn-icon" viewBox="0 0 24 24">
                <path
                  d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                />
                <polyline points="17 21 17 13 7 13 7 21" />
                <polyline points="7 3 7 8 15 8" />
              </svg>
              <span class="btn-text">حفظ المخصص المالي</span>
              <div class="spinner"></div>
            </button>
          </form>

          <div class="current-budget" id="currentBudget">
            <div class="label">المخصص المالي المسجل</div>
            <div class="value" id="displayValue">0</div>
            <div class="year-badge" id="displayYear"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="budget.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/main.js"></script>
  </body>
</html>
