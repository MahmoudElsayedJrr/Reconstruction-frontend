<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إضافة مشروع - نظام متابعة المشروعات</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/add-project.css" />
    <link rel="stylesheet" href="../css/searchable-dropdown.css" />
  </head>
  <body>
    <!-- Page Header -->
    <div class="page-header">
      <div class="container-fluid">
        <div class="header-content">
          <div class="header-title">
            <div class="icon-wrapper">
              <i class="fas fa-plus-circle"></i>
            </div>
            <div class="title-text">
              <h1>إضافة مشروع جديد</h1>
              <p class="header-subtitle">نظام متابعة وإدارة المشروعات</p>
            </div>
          </div>
          <a href="../html/dashboard.html" class="btn-back">
            <i class="fas fa-arrow-right"></i>
            <span>العودة للوحة التحكم</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="container-fluid main-content">
      <!-- Excel Upload Section (Compact Rectangle) -->
      <div class="excel-compact-card">
        <div class="excel-compact-body">
          <div class="excel-compact-info">
            <div class="excel-icon-pill">
              <i class="fas fa-file-excel"></i>
            </div>
            <div class="excel-compact-text">
              <span class="excel-compact-title">استيراد مشاريع من Excel</span>
              <span class="excel-compact-sub">رفع ملف Excel لإضافة مشاريع متعددة</span>
            </div>
          </div>

          <div class="excel-compact-actions">
            <input
              type="file"
              class="file-input"
              id="excelFile"
              accept=".xlsx,.xls"
            />
            <label for="excelFile" class="btn-choose-file">
              <i class="fas fa-paperclip"></i>
              <span id="excelFileLabel">إضافة ملف</span>
            </label>
            <button id="uploadExcelBtn" class="btn-upload-compact">
              <i class="fas fa-cloud-upload-alt"></i>
              <span>رفع الملف</span>
            </button>
          </div>
        </div>
        <div id="resultDiv" class="upload-result"></div>
      </div>

      <!-- Manual Form Section -->
      <div class="form-section">
        <div class="section-header">
          <div class="section-title">
            <i class="fas fa-edit"></i>
            <h3>إضافة مشروع يدوياً</h3>
          </div>
          <span class="section-badge">نموذج تفصيلي</span>
        </div>

        <div class="form-body">
          <form id="addProjectForm">
            <!-- البيانات الأساسية -->
            <div class="form-group-section">
              <div class="form-group-header">
                <div class="group-icon">
                  <i class="fas fa-info-circle"></i>
                </div>
                <h4>البيانات الأساسية</h4>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="activityName" class="field-label">
                    <i class="fas fa-project-diagram"></i>
                    اسم النشاط/المشروع
                    <span class="required">*</span>
                  </label>
                  <input
                    type="text"
                    id="activityName"
                    class="field-input"
                    placeholder="أدخل اسم المشروع..."
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="executingCompany" class="field-label">
                    <i class="fas fa-building"></i>
                    الشركة المنفذة
                  </label>
                  <input
                    type="text"
                    id="executingCompany"
                    class="field-input"
                    placeholder="أدخل اسم الشركة..."
                  />
                </div>

                <div class="form-field">
                  <label for="consultant" class="field-label">
                    <i class="fas fa-user-tie"></i>
                    الاستشاري
                  </label>
                  <input
                    type="text"
                    id="consultant"
                    class="field-input"
                    placeholder="أدخل اسم الاستشاري..."
                  />
                </div>

                <div class="form-field">
                  <label for="supervisorEngineer" class="field-label">
                    <i class="fas fa-hard-hat"></i>
                    المهندس المشرف
                  </label>
                  <input
                    type="text"
                    id="supervisorEngineer"
                    class="field-input"
                    placeholder="أدخل اسم المهندس..."
                  />
                </div>

                <div class="form-field">
                  <label for="supervisorPhone" class="field-label">
                    <i class="fas fa-phone"></i>
                    رقم تليفون المشرف
                  </label>
                  <input
                    type="tel"
                    id="supervisorPhone"
                    class="field-input"
                    placeholder="01XXXXXXXXX"
                    maxlength="11"
                    minlength="11"
                    pattern="\d{11}"
                    inputmode="numeric"
                    title="يجب إدخال 11 رقمًا فقط"
                  />
                </div>
              </div>
            </div>

            <!-- التصنيف والتمويل -->
            <div class="form-group-section">
              <div class="form-group-header">
                <div class="group-icon">
                  <i class="fas fa-tags"></i>
                </div>
                <h4>التصنيف والتمويل</h4>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="governorate" class="field-label">
                    <i class="fas fa-map-marker-alt"></i>
                    المحافظة
                    <span class="required">*</span>
                  </label>
                  <select id="governorate" class="field-select" required>
                    <option value="" disabled selected>اختر المحافظة...</option>
                    <option>شمال سيناء</option>
                    <option>جنوب سيناء</option>
                    <option>بورسعيد</option>
                    <option>الإسماعيلية</option>
                    <option>السويس</option>
                    <option>الشرقية</option>
                    <option>دمياط</option>
                  </select>
                </div>

                <div class="form-field">
                  <label for="projectCategory" class="field-label">
                    <i class="fas fa-layer-group"></i>
                    فئة المشروع
                    <span class="required">*</span>
                  </label>
                  <select id="projectCategory" class="field-select" required>
                    <option value="" disabled selected>اختر الفئة...</option>
                    <option>طرق</option>
                    <option>كهرباء</option>
                    <option>مياه</option>
                    <option>صرف صحي</option>
                    <option>منازل بدوية</option>
                    <option>إسكان اجتماعي</option>
                    <option>خدمات</option>
                    <option>تنمية متكاملة</option>
                    <option>حضانات</option>
                    <option>مجازر</option>
                    <option>تأهيل مباني حكومية</option>
                    <option>تجمعات تنموية</option>
                    <option>عمارات</option>
                  </select>
                </div>

                <div class="form-field">
                  <label for="fundingType" class="field-label">
                    <i class="fas fa-money-bill-wave"></i>
                    نوع التمويل
                    <span class="required">*</span>
                  </label>
                  <select id="fundingType" class="field-select" required>
                    <option value="" disabled selected>
                      اختر نوع التمويل...
                    </option>
                    <option>خطة استثمارية</option>
                    <option>تمويل الغير</option>
                  </select>
                </div>

                <div
                  class="form-field"
                  id="fundingSourceContainer"
                  style="display: none"
                >
                  <label for="fundingSource" class="field-label">
                    <i class="fas fa-university"></i>
                    مصدر التمويل
                  </label>
                  <select id="fundingSource" class="field-select">
                    <option value="" disabled selected>اختر المصدر...</option>
                    <option>صندوق الإسكان الاجتماعي</option>
                    <option>وزارة المالية</option>
                    <option>محافظة الإسماعيلية</option>
                    <option>محافظة بورسعيد</option>
                    <option>محافظة السويس</option>
                    <option>محافظة شمال سيناء</option>
                    <option>محافظة جنوب سيناء</option>
                    <option>محافظة الشرقية</option>
                    <option>محافظة دمياط</option>
                    <option>وزارة التضامن الاجتماعي</option>
                    <option>وزارة التنمية المحلية</option>
                    <option>وزارة الشباب والرياضة</option>
                    <option>وزارة الصحة والسكان</option>
                    <option>هيئة الإسعاف المصرية</option>
                    <option>هيئة الرقابة الإدارية</option>
                    <option>هيئة النيابة الإدارية</option>
                    <option>صندوق تطوير العشوائيات</option>
                    <option>الهيئة الاقتصادية لقناة السويس</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- البيانات المالية والزمنية -->
            <div class="form-group-section">
              <div class="form-group-header">
                <div class="group-icon">
                  <i class="fas fa-chart-line"></i>
                </div>
                <h4>البيانات المالية والزمنية</h4>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="fiscalYear" class="field-label">
                    <i class="fas fa-calendar-alt"></i>
                    السنة المالية
                  </label>
                  <select id="fiscalYear" class="field-select">
                    <option value="" selected disabled>
                      السنة المالية الحالية تلقائياً
                    </option>
                    <option value="2024/2025">2024/2025</option>
                    <option value="2025/2026">2025/2026</option>
                    <option value="2026/2027">2026/2027</option>
                    <option value="2027/2028">2027/2028</option>
                    <option value="2028/2029">2028/2029</option>
                    <option value="2029/2030">2029/2030</option>
                    <option value="2030/2031">2030/2031</option>
                    <option value="2031/2032">2031/2032</option>
                    <option value="2032/2033">2032/2033</option>
                    <option value="2033/2034">2033/2034</option>
                    <option value="2034/2035">2034/2035</option>
                    <option value="2035/2036">2035/2036</option>
                    <option value="2036/2037">2036/2037</option>
                    <option value="2037/2038">2037/2038</option>
                    <option value="2038/2039">2038/2039</option>
                    <option value="2039/2040">2039/2040</option>
                    <option value="2040/2041">2040/2041</option>
                  </select>
                </div>

                <div class="form-field">
                  <label for="estimatedValue" class="field-label">
                    <i class="fas fa-dollar-sign"></i>
                    القيمة التعاقدية (مليون ج.م)
                  </label>
                  <input
                    type="number"
                    step="any"
                    id="estimatedValue"
                    class="field-input"
                    placeholder="0.00"
                    value="0"
                  />
                </div>

                <div class="form-field">
                  <label for="contractualValue" class="field-label">
                    <i class="fas fa-coins"></i>
                    القيمة المعدلة (مليون ج.م)
                  </label>
                  <input
                    type="number"
                    step="any"
                    id="contractualValue"
                    class="field-input"
                    placeholder="0.00"
                    value="0"
                  />
                </div>

                <div class="form-field">
                  <label for="assignmentDate" class="field-label">
                    <i class="fas fa-calendar-check"></i>
                    تاريخ الإسناد
                  </label>
                  <input type="date" id="assignmentDate" class="field-input" />
                </div>

                <div class="form-field">
                  <label for="receptionDate" class="field-label">
                    <i class="fas fa-calendar-plus"></i>
                    تاريخ البدء
                  </label>
                  <input type="date" id="receptionDate" class="field-input" />
                </div>

                <div class="form-field">
                  <label for="completionDate" class="field-label">
                    <i class="fas fa-calendar-times"></i>
                    تاريخ النهو
                  </label>
                  <input type="date" id="completionDate" class="field-input" />
                </div>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
              <a href="../html/dashboard.html" class="btn-cancel">
                <i class="fas fa-times"></i>
                <span>إلغاء</span>
              </a>
              <button type="submit" class="btn-submit" id="save-project-button">
                <i class="fas fa-check"></i>
                <span>حفظ المشروع</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 start-0 p-3"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/searchable-dropdown.js"></script>
    <script src="../JS/project/add-project.js"></script>
    <script src="../JS/dashboard.js"></script>
    <script src="../JS/project/importingProjects.js"></script>
  </body>
</html>
