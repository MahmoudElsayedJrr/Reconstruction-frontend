<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إضافة مشروع - نظام متابعة المشروعات</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/add-project.css" />
  </head>
  <body class="no-sidebar">
    <main class="main-content">
      <div
        class="d-flex justify-content-between align-items-center mb-4 flex-wrap"
      >
        <h2 class="mb-0 fw-bold">إضافة مشروع جديد</h2>
        <a href="../html/dashboard.html" class="btn btn-outline-primary">
          <i class="fas fa-arrow-right me-2"></i>
          العودة للوحة التحكم
        </a>
      </div>

      <div class="card mb-4">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fas fa-file-import me-2"></i> اضافه مشاريع من ملف Excel
          </h5>
        </div>
        <div class="card-body">
          <div class="input-group">
            <input
              type="file"
              class="form-control"
              id="excelFile"
              accept=".xlsx,.xls"
            />
            <button
              id="uploadExcelBtn"
              class="btn btn-success btn-sm"
              type="button"
              style="white-space: nowrap"
            >
              <i class="fas fa-cloud-upload-alt me-1"></i> رفع
            </button>
          </div>
        </div>
        <div id="resultDiv" class="mt-3 px-3"></div>
      </div>

      <div class="card">
        <div class="card-header bg-light">
          <h5 class="mb-0">
            <i class="fas fa-plus-circle me-2"></i> إضافة مشروع جديد يدويًا
          </h5>
        </div>
        <div class="card-body p-4">
          <form id="addProjectForm">
            <div class="row g-3">
              <h5 class="form-section-title">البيانات الأساسية</h5>
              <!--  <div class="col-md-6">
                <label for="activityCode" class="form-label">كود النشاط</label
                ><input
                  type="text"
                  id="activityCode"
                  class="form-control"
                  required
                />
              </div> -->
              <div class="col-md-6">
                <label for="activityName" class="form-label"
                  >اسم النشاط/المشروع</label
                ><input
                  type="text"
                  id="activityName"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="executingCompany" class="form-label"
                  >الشركة المنفذة</label
                ><input
                  type="text"
                  id="executingCompany"
                  class="form-control"
                />
              </div>
              <div class="col-md-6">
                <label for="consultant" class="form-label">الاستشاري</label
                ><input type="text" id="consultant" class="form-control" />
              </div>

              <div class="col-md-6">
                <label for="supervisorEngineer" class="form-label"
                  >المهندس المشرف</label
                ><input
                  type="text"
                  id="supervisorEngineer"
                  class="form-control"
                />
              </div>

              <div class="col-md-6">
                <label for="supervisorPhone" class="form-label"
                  >رقم تليفون المشرف</label
                >
                <input
                  type="tel"
                  id="supervisorPhone"
                  class="form-control"
                  required
                  maxlength="11"
                  minlength="11"
                  pattern="\d{11}"
                  inputmode="numeric"
                  title="يجب إدخال 11 رقمًا فقط (بدون حروف)."
                />
              </div>

              <h5 class="form-section-title">التصنيف والتمويل</h5>
              <div class="col-md-4">
                <label for="governorate" class="form-label">المحافظة</label
                ><select id="governorate" class="form-select" required>
                  <option selected disabled value="">اختر...</option>
                  <option>شمال سيناء</option>
                  <option>جنوب سيناء</option>
                  <option>بورسعيد</option>
                  <option>الإسماعيلية</option>
                  <option>السويس</option>
                  <option>الشرقية</option>
                  <option>دمياط</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="projectCategory" class="form-label"
                  >فئة المشروع</label
                ><select id="projectCategory" class="form-select" required>
                  <option selected disabled value="">اختر...</option>
                  <option>طرق</option>
                  <option>كهرباء</option>
                  <option>مياه</option>
                  <option>صرف صحي</option>
                  <option>منازل بدوية</option>
                  <option>إسكان اجتماعي</option>
                  <option>خدمات</option>
                  <option>تنمية متكاملة</option>
                  <option>حضانات</option>
                  <option>مجازر</option>
                  <option>تأهيل مباني حكومية</option>
                  <option>تجمعات تنموية</option>
                  <option>اخر</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="fundingType" class="form-label">نوع التمويل</label
                ><select id="fundingType" class="form-select" required>
                  <option selected disabled value="">اختر...</option>
                  <option>خطة استثمارية</option>
                  <option>تمويل الغير</option>
                </select>
              </div>

              <div
                class="col-md-4"
                id="fundingSourceContainer"
                style="display: none"
              >
                <label for="fundingSource" class="form-label"
                  >مصدر التمويل</label
                >
                <select id="fundingSource" class="form-select">
                  <option selected disabled value="">اختر...</option>
                  <option>صندوق الإسكان الاجتماعي</option>
                  <option>وزارة المالية</option>
                  <option>محافظة الإسماعيلية</option>
                  <option>محافظة بورسعيد</option>
                  <option>محافظة السويس</option>
                  <option>محافظة شمال سيناء</option>
                  <option>محافظة جنوب سيناء</option>
                  <option>محافظة الشرقية</option>
                  <option>محافظة دمياط</option>
                  <option>وزارة التضامن الاجتماعي</option>
                  <option>وزارة التنمية المحلية</option>
                  <option>وزارة الشباب والرياضة</option>
                  <option>وزارة الصحة والسكان</option>
                  <option>هيئة الإسعاف المصرية</option>
                  <option>هيئة الرقابة الإدارية</option>
                  <option>هيئة النيابة الإدارية</option>
                  <option>صندوق تطوير العشوائيات</option>
                  <option>الهيئة الاقتصادية لقناة السويس</option>
                </select>
              </div>

              <h5 class="form-section-title">البيانات الماليه و الزمنية</h5>
              <div class="col-md-4">
                <label for="fiscalYear" class="form-label">السنة المالية</label>
                <select id="fiscalYear" class="form-select">
                  <option value="" selected disabled>
                    سيتم إدخال السنة المالية الحالية تلقائيًا إن لم يتم اختيارها
                  </option>
                  <option value="2025/2026">2024/2025</option>
                  <option value="2025/2026">2025/2026</option>
                  <option value="2026/2027">2026/2027</option>
                  <option value="2027/2028">2027/2028</option>
                  <option value="2028/2029">2028/2029</option>
                  <option value="2029/2030">2029/2030</option>
                  <option value="2030/2031">2030/2031</option>
                  <option value="2031/2032">2031/2032</option>
                  <option value="2032/2033">2032/2033</option>
                  <option value="2033/2034">2033/2034</option>
                  <option value="2034/2035">2034/2035</option>
                  <option value="2035/2036">2035/2036</option>
                  <option value="2036/2037">2036/2037</option>
                  <option value="2037/2038">2037/2038</option>
                  <option value="2038/2039">2038/2039</option>
                  <option value="2039/2040">2039/2040</option>
                  <option value="2040/2041">2040/2041</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="estimatedValue" class="form-label"
                  >القيمة التعاقديه (مليون ج.م)</label
                ><input
                  type="number"
                  step="any"
                  id="estimatedValue"
                  class="form-control"
                  value="0"
                />
              </div>
              <div class="col-md-4">
                <label for="contractualValue" class="form-label"
                  >القيمه المعدله (مليون ج.م) </label
                ><input
                  type="number"
                  step="any"
                  id="contractualValue"
                  class="form-control"
                  value="0"
                />
              </div>
              <!--
              <div class="col-md-4">
                <label for="disbursedAmount" class="form-label">المنصرف</label
                ><input
                  type="number"
                  id="disbursedAmount"
                  class="form-control"
                  value="0"
                />
              </div> -->
              <div class="col-md-4">
                <label for="assignmentDate" class="form-label"
                  >تاريخ الاسناد</label
                ><input type="date" id="assignmentDate" class="form-control" />
              </div>
              <div class="col-md-4">
                <label for="receptionDate" class="form-label">تاريخ البدء</label
                ><input type="date" id="receptionDate" class="form-control" />
              </div>
              <div class="col-md-4">
                <label for="completionDate" class="form-label"
                  >تاريخ النهو</label
                ><input type="date" id="completionDate" class="form-control" />
              </div>

              <div class="col-12 mt-4 text-center">
                <a href="../html/dashboard.html" class="btn btn-secondary px-4"
                  >إلغاء</a
                >
                <button
                  type="submit"
                  class="btn btn-primary px-4"
                  id="save-project-button"
                >
                  إضافه المشروع
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div class="toast-container position-fixed top-0 start-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/project/add-project.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/dashboard.js"></script>
    <script src="../JS/project/importingProjects.js"></script>
  </body>
</html>
