<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ملفي الشخصي - نظام متابعة المشروعات</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/settings.css" />
  </head>
  <body class="no-sidebar">
    <!-- Page Header -->
    <div class="page-header">
      <div class="header-content">
        <div class="header-title">
          <div class="icon-wrapper">
            <i class="fas fa-id-card"></i>
          </div>
          <div class="title-text">
            <h1>الملف الشخصي</h1>
            <p class="header-subtitle">عرض بيانات الحساب والتفاصيل الشخصية</p>
          </div>
        </div>
        <a href="../html/dashboard.html" class="btn-back">
          <i class="fas fa-arrow-right"></i>
          <span>العودة للوحة التحكم</span>
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="row g-4 justify-content-center">
        <div class="col-lg-6">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body text-center p-5">
              <div class="mb-4">
                <i class="fas fa-user-circle fa-6x text-primary"></i>
              </div>
              <h3 class="card-title fw-bold text-dark mb-1" id="profile-name">...</h3>
              <p class="badge bg-primary fs-6 px-3 py-2 rounded-pill mt-2" id="profile-role">...</p>
            </div>
            <ul class="list-group list-group-flush fs-6">
              <li class="list-group-item d-flex justify-content-between p-3">
                <strong class="text-secondary"><i class="fas fa-envelope me-2 text-primary"></i> البريد الإلكتروني:</strong>
                <span id="profile-email" class="fw-semibold">...</span>
              </li>
              <li class="list-group-item d-flex justify-content-between p-3">
                <strong class="text-secondary"><i class="fas fa-calendar-alt me-2 text-primary"></i> تاريخ إنشاء الحساب:</strong>
                <span id="profile-createdAt" class="fw-semibold">...</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </main>

    <div class="toast-container position-fixed top-0 start-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/constants.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/profile.js"></script>
  </body>
</html>
